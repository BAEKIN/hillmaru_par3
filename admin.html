<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>예약 현황 관리자 | PAR3 GOLF CLUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<!-- 로그인 게이트 -->
<div class="admin-gate" id="adminGate">
  <form class="admin-gate-box" id="adminLoginForm">
    <span class="logo-main admin-gate-logo">Par<em>3</em></span>
    <p class="admin-gate-sub">관리자 페이지</p>
    <p class="admin-gate-desc">예약 현황은 관리자만 열람할 수 있습니다.<br>비밀번호를 입력해주세요.</p>
    <input type="password" id="adminPassword" placeholder="비밀번호" autocomplete="current-password" required>
    <p class="admin-gate-error" id="adminGateError" hidden>비밀번호가 올바르지 않습니다.</p>
    <button type="submit" class="btn btn-solid admin-gate-submit">입장하기</button>
    <a href="index.html" class="admin-gate-back">← 홈페이지로 돌아가기</a>
  </form>
</div>

<!-- 관리자 콘텐츠 -->
<div class="admin-content" id="adminContent" hidden>
  <header class="admin-header">
    <span class="logo-main">Par<em>3</em></span>
    <span class="admin-header-title">예약 현황 관리자</span>
    <div class="admin-header-actions">
      <a href="index.html" class="btn btn-outline admin-nav-btn">홈페이지</a>
      <button type="button" class="btn btn-ghost-dark admin-logout-btn" id="adminLogoutBtn">로그아웃</button>
    </div>
  </header>

  <main class="status admin-main">
    <div class="section-head">
      <p class="section-eyebrow">STATUS</p>
      <h2>예약 현황</h2>
      <p class="section-desc">날짜별 예약 가능 시간을 확인하거나, 전체 예약 내역을 검색·취소할 수 있습니다.</p>
    </div>

    <div class="status-tabs" role="tablist">
      <button type="button" class="tab-btn is-active" id="tabTimetableBtn" role="tab" aria-selected="true">타임테이블</button>
      <button type="button" class="tab-btn" id="tabListBtn" role="tab" aria-selected="false">전체 예약 목록</button>
    </div>

    <div class="status-panel" id="timetablePanel">
      <div class="status-panel-head">
        <label for="ttDate">조회 날짜</label>
        <input type="date" id="ttDate">
      </div>
      <div class="timetable-grid" id="timetableGrid"></div>
    </div>

    <div class="status-panel" id="listPanel" hidden>
      <div class="status-panel-head">
        <label for="searchInput" class="sr-only">이름 또는 연락처 검색</label>
        <input type="text" id="searchInput" placeholder="이름 또는 연락처로 검색">
      </div>
      <div class="table-wrap">
        <table class="reserve-table" id="reserveTable">
          <thead>
            <tr>
              <th>날짜</th><th>시간</th><th>이름</th><th>연락처</th><th>인원</th><th>요청사항</th><th></th>
            </tr>
          </thead>
          <tbody id="reserveTableBody"></tbody>
        </table>
      </div>
      <p class="empty-state" id="emptyState" hidden>예약 내역이 없습니다.</p>
    </div>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
